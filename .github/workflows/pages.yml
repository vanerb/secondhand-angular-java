# Publica en GitHub Pages la demo estática: el frontend Angular con la API simulada en el navegador.
name: Demo en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Compilar la demo
        working-directory: frontend
        run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"
      - name: Preparar rutas de la SPA
        working-directory: frontend/dist/frontend/browser
        # GitHub Pages sirve 404.html para cualquier ruta desconocida: así funcionan los enlaces directos.
        run: |
          cp index.html 404.html
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
